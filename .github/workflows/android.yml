name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Gerar a versão web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Criar projeto Android
        run: |
          npx cap add android
          RUN_NUMBER=${{ github.run_number }} node scripts/android-setup.mjs
          npx cap sync android

      # Chave de assinatura fixa: sem ela, cada build teria uma assinatura nova
      # e o Android recusaria instalar a atualização por cima do app antigo.
      - name: Usar chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp android-keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: rotina-noturna-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rotina-noturna.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rotina-noturna.apk \
            --title "Rotina Noturna (build ${{ github.run_number }})" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe pelo celular e instale por cima da versão anterior."
