name: Publicar versão web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o número da versão é a contagem de commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Número da versão e endereço das atualizações
        run: |
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "UPDATE_URL=https://${OWNER}.github.io/${{ github.event.repository.name }}/update/" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD: ${{ env.BUILD }}
          VITE_UPDATE_URL: ${{ env.UPDATE_URL }}
      # Pacote que o APK baixa sozinho: o conteúdo de dist na raiz do zip + version.json.
      - name: Gerar pacote de atualização do APK
        run: |
          NATIVE_API=$(node -p "require('./package.json').nativeApi || 1")
          mkdir -p update
          (cd dist && zip -qr "../update/bundle-${BUILD}.zip" .)
          mv update dist/update
          printf '{"version":%s,"zip":"bundle-%s.zip","nativeApi":%s}\n' "$BUILD" "$BUILD" "$NATIVE_API" > dist/update/version.json
          cat dist/update/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
