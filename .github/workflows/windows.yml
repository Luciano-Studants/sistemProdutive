name: Gerar instalador Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar a versão web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Gerar o instalador
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Guardar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: rotina-noturna-windows
          path: release/Rotina-Noturna-Setup.exe

      - name: Publicar na página de Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --yes --cleanup-tag || true
          gh release create windows release/Rotina-Noturna-Setup.exe \
            --title "Rotina Noturna para Windows (build ${{ github.run_number }})" \
            --notes "Instalador gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe e execute. O Windows pode mostrar o aviso do SmartScreen porque o instalador não é assinado: clique em Mais informações e depois em Executar assim mesmo."
